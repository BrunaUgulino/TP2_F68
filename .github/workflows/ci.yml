name: CI - FastAPI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install safety -r requirements.txt

      - name: Vérification de la sécurité des dépendances
        run: safety check

  tests:
    needs: security
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov -r requirements.txt

      - name: Exécution des tests avec couverture
        run: pytest --cov=.

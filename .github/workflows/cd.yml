name: CD - FastAPI

on:
  workflow_run:
    workflows: ["CI - FastAPI"]
    types:
      - completed

jobs:
  deploy:
    # Le déploiement s'exécute uniquement si le pipeline CI a réussi ET s'il a été déclenché depuis la branche 'main'
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Simulation du déploiement
        run: |
          echo "Initialisation du déploiement continu..."
          echo "Vérification des artéfacts et des dépendances..."
          echo "Déploiement simulé avec succès sur l'environnement de production !"

  
